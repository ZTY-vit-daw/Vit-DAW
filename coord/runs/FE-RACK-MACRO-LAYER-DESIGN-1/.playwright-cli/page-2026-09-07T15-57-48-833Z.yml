          - heading "5.1 Reverse Engineering" [level=3] [ref=f17e1491]:
            - generic [ref=f17e1492]: "5.1"
            - text: Reverse Engineering
          - paragraph [ref=f17e1494]:
            - text: Comparison on Fx-chain Planning. Table
            - link "2" [ref=f17e1495] [cursor=pointer]:
              - /url: "#S5.T2"
            - text: demonstrates that LLM2Fx-Tools achieves superior performance across multiple evaluation dimensions. In Fx-chain Planning, our approach significantly outperforms all baselines, achieving 80% accuracy in audio effects module classification and 0.56 Spearman correlation for ordering, compared to the MultiTask baseline with 61% accuracy and near-zero correlation. While the regression baseline achieves slightly better parameter MAE (0.20 vs 0.23), this comes at the cost of substantially worse audio effects module selection and ordering capabilities. As DeepAFx-ST is trained directly with an audio domain objective, it exhibits strong performance on audio distance metrics; yet, it lacks the capability to utilize non-differeneitable modules. Interestingly, Gemini 2.5 Flash demonstrates strong Fx-chain Planning capabilities with 78% effect classification accuracy and reasonable ordering correlation (0.54). However, it exhibits limitations in parameter estimation, achieving the highest parameter MAE (0.32).
          - paragraph [ref=f17e1497]: "The performance improvements of LLM2Fx-Tools stem from two key aspects: 1) our instruction-following capabilities leverage natural language understanding to provide additional conditioning beyond pure audio comprehension, enabling more precise and semantically-aware audio processing decisions; and 2) the autoregressive sequence modeling inherent in LLMs provides a fundamental advantage for handling Fx-chain ordering compared to models that rely solely on audio features."
          - paragraph [ref=f17e1499]: Does Fx-chain Planning Lead to Better Acoustic Similarity? For Perceptual Distance, LLM2Fx-Tools achieves the competitive performance on both MRS distances. Our analysis indicates that effective Fx-chain Planning is essential not only for accurate parameter prediction but also for achieving strong perceptual performance. Notably, while the regression baseline achieves the lowest parameter MAE (0.20), this advantage in parameter space does not translate into improved perceptual distance. Because the regression model lacks the ability to selectively apply audio effects modules, it must predict parameters for all predefined modules, even when they are absent in the reference audio. This limitation leads to suboptimal perceptual distance, underscoring the importance of Fx-chain planning for bridging parameter accuracy and perceptual quality.
          - paragraph [ref=f17e1501]: "In contrast, both the MultiTask baseline and our LLM2Fx-Tools framework, which incorporate audio effects module selection capabilities, demonstrate superior performance in both perceptual and DSP distance compared to the base regression approach. Comparing MultiTask vs LLM2Fx-Tools further demonstrates the critical importance of Fx-chain ordering: despite achieving similar DSP distances (8.39 vs 8.29), LLM2Fx-Tools’s substantial improvement in ordering correlation (0.56 vs 0.00) leads to better perceptual reconstruction (3.13 vs 3.17 L/R MRS). This indicates that correct effect sequencing significantly contributes to audio processing quality, as the order of effects can dramatically alter the final audio output. For Deep Embedding Similarity, LLM2Fx-Tools achieves the highest similarity scores (AFx-Rep: 0.68, Fx-Encoder: 0.67), demonstrating that effective Fx-chain outputs more semantically similar to reference audio."
          - paragraph [ref=f17e1503]:
            - text: Ablation Studies. The lower portion of Table
            - link "2" [ref=f17e1504] [cursor=pointer]:
              - /url: "#S5.T2"
            - text: demonstrates that our core design choices contribute meaningfully to model performance. Chain-of-Thought (CoT) reasoning significantly aids Fx-chain Planning capabilities, improving effect classification accuracy from 67% to 80% and enhancing ordering correlation from 0.49 to 0.56. Number Token Loss (NTL) notably impacts parameter estimation, reducing MAE from 0.32 to 0.23, while also improving overall perceptual and feature-level metrics. MST provides improvements across all metrics, bridging the representations between the pretrained audio encoder and LLM while leveraging the pretrained capabilities of Qwen3.
          - 'figure "Figure 4: Subjective evaluation on reverse engineering." [ref=f17e1505]':
