                        - cell "Here is a plugin chain designed to emulate the audio effects style of your reference audio," [ref=f17e2285]
                      - row [ref=f17e2286]:
                        - cell "featuring a stereo widener, distortion, and a compressor. The stereo widener is set to" [ref=f17e2287]
                      - row [ref=f17e2288]:
                        - cell "a width of 1.3 to expand the stereo image. Following this, a distortion effect with" [ref=f17e2289]
                      - row [ref=f17e2290]:
                        - cell "a drive of 5.0 dB is applied to add harmonic content." [ref=f17e2291]
