          - paragraph [ref=f17e1612]: "Among LLM-based approaches, Gemini 2.5 Flash performs poorly, yielding a DSP distance of 9.00 and embedding similarities barely above the No Fx baseline, despite its large parameter count. Our reverse engineering experiments reveal that its parameter predictions are nearly random, which explains why it fails to generalize effectively to the style transfer task. In contrast, LLM2Fx-Tools consistently achieves the best results, with the lowest DSP distance (7.41) and the highest embedding similarity scores (AFx-Rep: 0.35, Fx-Encoder: 0.49) across all evaluated methods."
        - generic [ref=f17e1613]:
          - heading "5.3 Natural Language Generation" [level=3] [ref=f17e1614]:
