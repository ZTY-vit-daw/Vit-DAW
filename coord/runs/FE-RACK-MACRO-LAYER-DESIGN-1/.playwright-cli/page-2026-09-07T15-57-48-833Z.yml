            - text: presents the MUSHRA test results. The hidden reference achieves a mean score of 81.5, confirming the validity of our test design. Our proposed LLM2Fx-Tools outperforms other methods. Pairwise t-tests reveal that LLM2Fx-Tools (62.8), Gemini 2.5 Flash (56.5), and DeepAFX-ST (54.8) all significantly outperform the No Fx baseline (39.1) with
