          - paragraph [ref=f17e1680]: The instruction following evaluation reveals substantial quality improvements from domain-specific training. LLM2Fx-Tools outperforms zero-shot baselines, with quality scores increasing from 3.63 to 3.86 compared to the base Qwen 3 model. This improvement demonstrates the critical importance of specialized training for music production tasks, where general-purpose models lack domain-specific knowledge about audio effects and their applications.
          - paragraph [ref=f17e1682]: Additionally, CoT quality evaluation shows that LLM2Fx-Tools outperforms other LLM baselines. This can be attributed to LLM2Fx-Tools’s training on high-quality CoT dataset specifically focused on music production tasks. The training dataset LP-Fx leverages knowledge distillation from Gemini2.5 Flash, with quality assurance provided through filtering by Gemini2.5 Pro. This multi-stage data synthesis approach is expected to enhance the CoT capabilities of the fine-tuned model, enabling more coherent and domain-relevant reasoning for audio effects manipulation.
      - generic [ref=f17e1683]:
        - heading "6 Limitation" [level=2] [ref=f17e1684]:
          - generic [ref=f17e1685]: "6"
          - text: Limitation
        - paragraph [ref=f17e1687]:
          - text: While our framework advances interpretable and controllable Fx-chain estimation, several challenges remain. First, the predicted Fx-chain is interpretable only relative to pseudo-dry audio obtained through Fx-removal and Fx-normalization preprocessing. Full interpretability would require integrating these preprocessing steps directly into the Fx-chain representation and reasoning process. Second, the inherent one-to-many mapping in audio effects estimation
          - generic [ref=f17e1688]:
            - text: (
            - link "Hayes et al., 2025" [ref=f17e1689] [cursor=pointer]:
              - /url: "#bib.bib36"
            - text: )
          - text: creates ambiguity where multiple distinct Fx-chains can produce perceptually similar results, particularly in symmetric parameter spaces. Our current evaluation framework does not fully account for this fundamental ambiguity,
          - generic [ref=f17e1690]: and the limited scale of LP-Fx’s evaluation set further constrains the ability to comprehensively assess these challenges.
          - text: Third, our experimental validation focuses exclusively on single-instrument sources, which may limit direct applicability to complex multitrack music production scenarios. Furthermore, we have not evaluated generalization to unseen audio effects modules beyond our training distribution. While our tool-calling framework is designed to be extensible to new VST plugins and audio effects modules, empirical validation of this capability remains future work.
      - generic [ref=f17e1691]:
        - heading "7 Conclusion" [level=2] [ref=f17e1692]:
          - generic [ref=f17e1693]: "7"
          - text: Conclusion
        - paragraph [ref=f17e1695]: We present LLM2Fx-Tools, a multimodal tool-calling framework for generating executable audio effect chains with interpretable chain-of-thought planning. Our experimental results demonstrate that LLM2Fx-Tools outperforms regression and multitask baselines on both reverse engineering and audio effects style transfer tasks. Additional evaluations through LLM-as-a-judge confirm the natural language generation capabilities of our approach, demonstrating strong instruction following and chain-of-thought reasoning quality. By emitting structured tool calls over audio effect modules, our approach enables controllable and explainable music post-production applications. This work opens several promising directions for future research, including scaling to richer VST plugin toolboxes, developing reinforcement learning frameworks, and conducting comprehensive perceptual evaluations with expert music producers to validate real-world applicability.
