          - generic [ref=f17e3458]: "# Instruction Following Quality:"
          - generic [ref=f17e3459]: "Poor (1): The response does not follow the user’s instructions, ignores key requirements, or provides irrelevant information. The answer is not in natural language or does not address the task described in the instruction."
          - generic [ref=f17e3460]: "Fair (2): The response partially follows the instructions, but misses important details or only addresses some aspects of the user’s request. The natural language answer may be incomplete or only loosely related to the instruction."
          - generic [ref=f17e3461]: "Good (3): The response follows the instructions well, addresses most requirements, and provides a mostly complete and relevant answer in natural language that matches the task in the instruction, but may lack some detail or completeness."
          - generic [ref=f17e3462]: "Excellent (4): The response fully follows the user’s instructions, addresses all requirements in detail, and provides a clear, relevant, and comprehensive answer in natural language that is directly aligned with the task described in the instruction."
          - generic [ref=f17e3464]: "# Chain of Thought Quality:"
          - generic [ref=f17e3465]: "Poor (1): The chain of thought does not logically connect the user’s query to the assistant’s response, lacking coherent reasoning about audio processing decisions. The reasoning fails to demonstrate proper task decomposition, analysis of user input, and planning for effect chain implementation. Or the chain of thought is empty."
          - generic [ref=f17e3466]: "Fair (2): The reasoning attempts to bridge the user’s query and the assistant’s response but contains gaps in logic or shows limited understanding of audio processing principles. Some evidence of task decomposition and planning to handle user input may be present but incomplete or flawed."
          - generic [ref=f17e3467]: "Good (3): The chain of thought clearly links the user’s query to the assistant’s response, demonstrating effective task decomposition and planning. The reasoning provides clear evidence of user input analysis and systematic planning to handle requirements with mostly sound logic."
          - generic [ref=f17e3468]: "Excellent (4): The reasoning expertly bridges the user’s query and the assistant’s response through comprehensive task decomposition and strategic planning. The analysis demonstrates thorough task decomposition, comprehensive planning to handle user input, and expert-level reasoning throughout the process."
