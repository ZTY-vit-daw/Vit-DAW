        - paragraph [ref=f17e3346]: "Mid/Side MRS: We convert stereo audio to Mid/Side representation and compute MRS distance. Mid-channel captures mono content (addition of left and right channels) while Side-channel captures stereo width and spatial characteristics (subtraction of left and right channels)."
        - paragraph [ref=f17e3348]: "DSP Feature Distance: We extract digital signal processing (DSP) based low-level descriptors, including the root mean square and crest factor, stereo width and stereo imbalance and bark spectrum corresponding to the dynamics, spatialization and spectral attributes respectively."
        - paragraph [ref=f17e3350]:
          - text: "Embedding Similarity: We use pretrained audio effect encoders to extract semantic representations and compute cosine similarity for different types of audio encoders, including AFX-Reps"
