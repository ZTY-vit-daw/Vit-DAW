        - heading "1 Introduction" [level=2] [ref=f17e161]:
          - generic [ref=f17e162]: "1"
          - text: Introduction
        - paragraph [ref=f17e164]:
          - text: The use of Audio effects (Fx) processing constitutes a fundamental component of modern music post-production, where producers systematically apply sequences of effects (Fx-chain) to transform audio signals and achieve desired sound textures
          - generic [ref=f17e165]:
            - text: (
            - link "Zölzer et al., 2002" [ref=f17e166] [cursor=pointer]:
              - /url: "#bib.bib63"
            - text: ;
            - link "De Man and Reiss, 2013" [ref=f17e167] [cursor=pointer]:
              - /url: "#bib.bib62"
            - text: )
          - text: . In most post-production workflows, the application of audio effects is guided by both technical and creative criteria, requiring a high level of expertise from audio engineers. Estimating the appropriate Fx-chain from unprocessed input audio (dry), processed output audio (wet), or by reverse engineering from both requires extensive domain expertise and often involves iterative manual adjustment.
        - 'figure "Figure 1: An illustration of the LLM2Fx-Tools framework. The input to LLM2Fx-Tools consists of instruction, available tools, reference audio, and (pseudo) dry audio that is preprocessed with audio effects removal and noramlization (Fx-Removal and Fx-Norm). The framework outputs chain of thought, tool calling procedure, and response. The generated tool calling outputs (Fx-chain) are then combined with tool environments (audio effects modules) to enable the transformation of new audio in the style of the reference audio." [ref=f17e168]':
          - img "Refer to caption" [ref=f17e169]
          - generic [ref=f17e170]:
            - generic [ref=f17e171]: "Figure 1:"
            - text: An illustration of the LLM2Fx-Tools framework. The input to LLM2Fx-Tools consists of instruction, available tools, reference audio, and (pseudo) dry audio that is preprocessed with audio effects removal and noramlization (Fx-Removal and Fx-Norm). The framework outputs chain of thought, tool calling procedure, and response. The generated tool calling outputs (Fx-chain) are then combined with tool environments (audio effects modules) to enable the transformation of new audio in the style of the reference audio.
        - paragraph [ref=f17e173]:
          - text: To address this challenge, automatic Fx-chain estimation has emerged as a promising approach to reduce barrier and labor-intensive aspects of music production. Previous works focus on signal processing-based optimization
          - generic [ref=f17e174]:
            - text: (
            - link "Barchiesi and Reiss, 2010" [ref=f17e175] [cursor=pointer]:
              - /url: "#bib.bib60"
            - text: ;
            - link "Giannoulis et al., 2013" [ref=f17e176] [cursor=pointer]:
              - /url: "#bib.bib64"
            - text: ;
            - link "Ma et al., 2015" [ref=f17e177] [cursor=pointer]:
              - /url: "#bib.bib65"
            - text: )
          - text: ", gradient-based optimization"
          - generic [ref=f17e178]:
            - text: (
            - link "Colonel and Reiss, 2021" [ref=f17e179] [cursor=pointer]:
              - /url: "#bib.bib61"
            - text: ;
            - link "Lee et al., 2024" [ref=f17e180] [cursor=pointer]:
              - /url: "#bib.bib57"
            - text: ;
            - link "Steinmetz et al., 2024" [ref=f17e181] [cursor=pointer]:
              - /url: "#bib.bib20"
            - text: ;
            - link "Koo et al., 2025" [ref=f17e182] [cursor=pointer]:
              - /url: "#bib.bib22"
            - text: ;
            - link "Lee et al., 2025" [ref=f17e183] [cursor=pointer]:
              - /url: "#bib.bib59"
            - text: ;
            - link "Yu et al., 2025" [ref=f17e184] [cursor=pointer]:
              - /url: "#bib.bib14"
            - text: )
          - text: ", regression methods"
          - generic [ref=f17e185]:
            - text: (
            - link "Rämö and Välimäki, 2019" [ref=f17e186] [cursor=pointer]:
              - /url: "#bib.bib52"
            - text: ;
            - link "Sheng and Fazekas, 2019" [ref=f17e187] [cursor=pointer]:
              - /url: "#bib.bib51"
            - text: ;
            - link "Mimilakis et al., 2020" [ref=f17e188] [cursor=pointer]:
              - /url: "#bib.bib50"
            - text: ;
            - link "Martínez-Ramírez et al., 2021" [ref=f17e189] [cursor=pointer]:
              - /url: "#bib.bib53"
            - text: ;
            - link "Steinmetz et al., 2022" [ref=f17e190] [cursor=pointer]:
              - /url: "#bib.bib58"
            - text: ;
            - link "Hayes et al., 2025" [ref=f17e191] [cursor=pointer]:
              - /url: "#bib.bib36"
            - text: )
          - text: ", and multitask methods"
          - generic [ref=f17e192]:
            - text: (
            - link "Mitcheltree and Koike, 2020" [ref=f17e193] [cursor=pointer]:
              - /url: "#bib.bib15"
            - text: ;
            - link "Lee et al., 2023" [ref=f17e194] [cursor=pointer]:
              - /url: "#bib.bib55"
            - text: ;
            - link "Take et al., 2024" [ref=f17e195] [cursor=pointer]:
              - /url: "#bib.bib24"
            - text: )
          - text: . While these methods demonstrate promising performance, they face several fundamental limitations. First, gradient-based methods require differentiable audio effects modules, limiting their applicability to specific effects. Second, regression and signal processing-based methods operate on fixed, predefined configurations and lack the ability to dynamically select effects and determine their ordering. Furthermore, these approaches lack user-level interpretability, as they provide only Fx-chain without human-readable descriptions or reasoning to explain why such decisions are made.
        - paragraph [ref=f17e197]:
          - text: Meanwhile, recent advances in large language models
          - generic [ref=f17e198]:
            - text: (
            - link "Achiam et al., 2023" [ref=f17e199] [cursor=pointer]:
              - /url: "#bib.bib48"
            - text: ;
            - link "Grattafiori et al., 2024" [ref=f17e200] [cursor=pointer]:
              - /url: "#bib.bib47"
            - text: ;
            - link "Comanici et al., 2025" [ref=f17e201] [cursor=pointer]:
              - /url: "#bib.bib25"
            - text: )
          - text: (LLMs) have introduced powerful capabilities including instruction following
          - generic [ref=f17e202]:
            - text: (
            - link "Achiam et al., 2023" [ref=f17e203] [cursor=pointer]:
              - /url: "#bib.bib48"
            - text: ;
            - link "Wei et al., 2022a" [ref=f17e204] [cursor=pointer]:
              - /url: "#bib.bib13"
            - text: )
          - text: ", chain-of-thought reasoning"
          - generic [ref=f17e205]:
            - text: (
            - link "Wei et al., 2022b" [ref=f17e206] [cursor=pointer]:
              - /url: "#bib.bib30"
            - text: )
          - text: ", and tool calling"
          - generic [ref=f17e207]:
            - text: (
            - link "Schick et al., 2023" [ref=f17e208] [cursor=pointer]:
              - /url: "#bib.bib46"
            - text: )
          - text: . Chain-of-thought (CoT) enables models to decompose a complex task into a series of reasoning sub-tasks, providing an interpretable view of its reasoning process
          - generic [ref=f17e209]:
            - text: (
            - link "Wei et al., 2022b" [ref=f17e210] [cursor=pointer]:
              - /url: "#bib.bib30"
            - text: )
          - text: . Tool calling enables LLMs to flexibly connect with external modules (e.g., non-differentiable audio effect modules) and knowledge bases to accomplish domain specific tasks
          - generic [ref=f17e211]:
            - text: (
            - link "Schick and Schütze, 2020" [ref=f17e212] [cursor=pointer]:
              - /url: "#bib.bib45"
            - text: ;
            - link "Gao et al., 2023" [ref=f17e213] [cursor=pointer]:
              - /url: "#bib.bib44"
            - text: ;
            - link "Doh et al., 2025a" [ref=f17e214] [cursor=pointer]:
              - /url: "#bib.bib10"
            - text: )
          - text: . These capabilities present new opportunities to address the flexibility and interpretability issues in Fx-chain prediction. In the context of music post-production specifically, LLM2Fx
          - generic [ref=f17e215]:
            - text: (
            - link "Doh et al., 2025c" [ref=f17e216] [cursor=pointer]:
              - /url: "#bib.bib43"
            - text: )
          - text: predicts audio effects parameters from natural language prompts, but it does not employ explicit tool calling or chain-of-thought reasoning and is limited to single effects (Equalization and Reverb).
        - paragraph [ref=f17e218]: "In this work, we introduce LLM2Fx-Tools, LLM-based Fx-chain estimation with Tool-calling, a multimodal framework that addresses these limitations by enabling flexible Fx-chain prediction through tool calling and enhancing interpretability with chain-of-thought reasoning. LLM2Fx-Tools generates 1) chain-of-thought, 2) executable Fx-chain and 3) natural language response. Our key contributions are:"
        - paragraph [ref=f17e220]: "Tool-Calling for Music Production: We develop the first structured tool-calling approach for Fx-chain generation that enables multimodal LLMs to understand audio conditioning and generate executable tool calls for non-differentiable audio effects modules."
        - paragraph [ref=f17e222]: "Chain-of-Thought for Fx-chain Planning: We utilize a chain-of-thought (CoT) mechanism designed for Fx-chain generation that decomposes the complex task into interpretable sub-tasks: effect selection, order determination, and parameter estimation. This intermediate reasoning bridges the gap between user inputs and target Fx-chain, improving both performance and interpretability."
        - paragraph [ref=f17e224]: "Multimodal Instruction-Following: We extend the Fx-chain estimation task from unimodal audio-to-effects mapping to a multimodal framework incorporating natural language instructions. Users can specify preferred effect types, musical genres, or instrument characteristics, enabling customized Fx-chains that align with specific user requirements."
        - paragraph [ref=f17e226]: "Conversational Music Production Dataset: We introduce LP-Fx, LLM-based music production dataset for audio effects tools, containing 101K conversational examples with structured Tool Calling, Chain-of-Thought, and Response. Each example comprises 1) user instructions, 2) audio effects tool calls, 3) chain-of-thought, and 4) responses."
