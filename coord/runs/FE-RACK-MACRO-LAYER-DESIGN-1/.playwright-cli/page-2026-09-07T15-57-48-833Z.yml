            - text: presents the experiment results of audio effects style transfer, designed to evaluate the cross-domain generalization capabilities of each method. We observe similar trends to those seen in reverse engineering experiments. The regression baseline, which applies all predefined audio effects regardless of their relevance, achieves suboptimal performance with higher AF distance (7.83) and lower embedding similarity scores. The MultiTask approach shows modest improvements with better AF distance (7.62) and enhanced embedding similarities, highlighting the importance of selective effect application. However, its lack of ordering capabilities limits further performance gains. DeepAFx-ST exhibits worse AF distance in the style transfer experiments, indicating limited generalization in this setting.
