              - row [ref=f17e2224]:
                - cell [ref=f17e2225]:
                  - table [ref=f17e2226]:
                    - rowgroup [ref=f17e2227]:
                      - row [ref=f17e2228]:
                        - cell "I’m working on a track with Electronic/Fusion synthesizer sounds, and I’d like to emulate" [ref=f17e2229]
