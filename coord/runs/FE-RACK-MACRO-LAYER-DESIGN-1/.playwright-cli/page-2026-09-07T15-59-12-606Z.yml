                  - paragraph [ref=f21e412]: A multimodal framework that fine-tunes LLMs to generate executable sequences of audio effect tool calls for music post-production. Given a pair of dry and wet audio signals, the model predicts the effect chain (type, order, and parameters) as structured tool calls via Supervised Fine-Tuning (SFT).
