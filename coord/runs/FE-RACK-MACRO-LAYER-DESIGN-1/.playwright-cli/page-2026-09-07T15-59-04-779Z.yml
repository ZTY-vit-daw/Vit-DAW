              - article [ref=f20e289]:
                - generic [ref=f20e290]:
                  - heading "LLM for Music Post-Production" [level=1] [ref=f20e291]
                  - 'link "Permalink: LLM for Music Post-Production" [ref=f20e292] [cursor=pointer]':
                    - /url: "#llm-for-music-post-production"
                - paragraph [ref=f20e295]: This repository contains the resources for two research papers that explore how Large Language Models can be applied to audio effect parameter prediction in music post-production. The first paper (LLM2Fx) investigates zero-shot and in-context learning approaches for text-to-parameter prediction, while the second paper (LLM2Fx-Tools) introduces a multimodal framework that fine-tunes LLMs to generate executable sequences of audio effect tool calls from audio-to-audio pairs.
                - paragraph [ref=f20e296]:
                  - link [ref=f20e297] [cursor=pointer]:
                    - /url: https://camo.githubusercontent.com/dd0f73f261a9dddec37b678a128cb72b8c30c2853cefe4af69775e40655fac7d/68747470733a2f2f692e696d6775722e636f6d2f463962755a4f4c2e706e67
                    - img "LLM for Music Post-Production" [ref=f20e298]
                - separator [ref=f20e299]
                - generic [ref=f20e300]:
                  - heading "LLM2Fx — Text-to-Parameter" [level=2] [ref=f20e301]
                  - 'link "Permalink: LLM2Fx — Text-to-Parameter" [ref=f20e302] [cursor=pointer]':
                    - /url: "#llm2fx--text-to-parameter"
                - paragraph [ref=f20e305]:
                  - strong [ref=f20e306]: Can Large Language Models Predict Audio Effects Parameters from Natural Language?
                - paragraph [ref=f20e307]:
                  - link [ref=f20e308] [cursor=pointer]:
                    - /url: https://arxiv.org/abs/2505.20770
                    - img "arXiv" [ref=f20e309]
                  - link [ref=f20e310] [cursor=pointer]:
                    - /url: https://seungheondoh.github.io/llm2fx-demo/
                    - img "Demo" [ref=f20e311]
                  - link [ref=f20e312] [cursor=pointer]:
                    - /url: https://huggingface.co/collections/seungheondoh/llm2fx-6821b961b982fe1eab1b00bf
                    - img "Dataset" [ref=f20e313]
                - generic [ref=f20e314]:
                  - heading "Overview" [level=3] [ref=f20e315]
                  - 'link "Permalink: Overview" [ref=f20e316] [cursor=pointer]':
                    - /url: "#overview"
                - paragraph [ref=f20e319]:
                  - text: LLM2Fx investigates whether LLMs can translate natural language descriptions into audio effect parameters (EQ, reverb) without task-specific training. We show that off-the-shelf LLMs can perform this
                  - strong [ref=f20e320]: Text-to-Parameter
                  - text: task in a zero-shot manner, and propose three in-context learning strategies — audio DSP features, DSP function code, and few-shot examples — that further boost performance.
                - list [ref=f20e321]:
                  - listitem [ref=f20e322]:
                    - strong [ref=f20e323]: Zero-shot Text-to-Parameter
                    - text: ": LLMs can generate audio effect parameters directly from text without fine-tuning"
                  - listitem [ref=f20e324]:
                    - strong [ref=f20e325]: In-context learning strategies
                    - text: ": DSP feature injection, DSP function code, and few-shot examples for improved accuracy"
                - separator [ref=f20e326]
                - generic [ref=f20e327]:
                  - heading "LLM2Fx-Tools — Audio-to-Parameter via Tool Calling" [level=2] [ref=f20e328]
                  - 'link "Permalink: LLM2Fx-Tools — Audio-to-Parameter via Tool Calling" [ref=f20e329] [cursor=pointer]':
                    - /url: "#llm2fx-tools--audio-to-parameter-via-tool-calling"
                - paragraph [ref=f20e332]:
                  - strong [ref=f20e333]: "LLM2Fx-Tools: Tool Calling For Music Post-Production"
                - paragraph [ref=f20e334]:
                  - link [ref=f20e335] [cursor=pointer]:
                    - /url: https://arxiv.org/abs/2512.01559
                    - img "arXiv" [ref=f20e336]
                  - link [ref=f20e337] [cursor=pointer]:
                    - /url: https://seungheondoh.github.io/llm2fx-tools-demo/
                    - img "Demo" [ref=f20e338]
                  - link [ref=f20e339] [cursor=pointer]:
                    - /url: "#"
                    - img "Dataset(soon)" [ref=f20e340]
                - generic [ref=f20e341]:
                  - heading "Overview" [level=3] [ref=f20e342]
                  - 'link "Permalink: Overview" [ref=f20e343] [cursor=pointer]':
                    - /url: "#overview-1"
                - paragraph [ref=f20e346]:
                  - text: LLM2Fx-Tools extends the LLM2Fx paradigm to
                  - strong [ref=f20e347]: Audio-to-Parameter
                  - text: prediction using an LLM tool-calling framework. Given a pair of unprocessed and processed audio signals, the model generates an executable sequence of audio effect modules (tool calls) along with their parameters.
                - list [ref=f20e348]:
                  - listitem [ref=f20e349]:
                    - strong [ref=f20e350]: Tool-calling framework for audio effects
                    - text: ": LLMs generate structured, executable sequences of audio effect module calls"
                  - listitem [ref=f20e351]:
                    - strong [ref=f20e352]: SFT on tool sequences
                    - text: ": LLM fine-tuned to predict effect type, ordering, and parameters autoregressively"
