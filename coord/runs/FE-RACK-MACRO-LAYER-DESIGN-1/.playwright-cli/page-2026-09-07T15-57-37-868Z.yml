            - generic [ref=f4e220]: "3.2"
            - text: Ornamentation and Equalization
          - paragraph [ref=f4e222]: "We organize spectral and temporal effects into four families: time-based, modulation, dynamics, and equalization. Time-based effects introduce delayed copies of the signal. POEMS includes delay (single-tap with feedback and dry/wet mix) and an algorithmic reverb parameterized by room size, damping, wet and dry levels, stereo width, and freeze mode. Modulation effects vary a parameter of the signal periodically. POEMS includes chorus (low-frequency delay-line modulation with feedback) and phaser (all-pass-based phase modulation around a center frequency). Dynamics effects apply level-dependent gain. POEMS includes a feed-forward compressor (threshold, ratio, attack, release), a peak limiter (a high-ratio compressor with fast release and a brick-wall ceiling), waveshaping distortion, a noise gate (downward expansion below a threshold), and a split-band de-esser that applies compression to the sibilant band to reduce harsh sibilant sounds such as “s”."
          - paragraph [ref=f4e224]:
            - text: Equalization effects shape the magnitude response of the signal across frequency. POEMS provides high-pass, low-pass, high-shelf, low-shelf, and parametric peaking filters, each parameterized by cutoff frequency and, where applicable, gain and quality factor (
            - math [ref=f4e225]:
