            - text: Agent States
          - generic [ref=f4e2840]:
            - paragraph [ref=f4e2841]: We keep track of four main states in the agent
            - list [ref=f4e2842]:
              - listitem [ref=f4e2843]:
                - generic [ref=f4e2844]: "1."
                - paragraph [ref=f4e2846]: Working Audio State - The agent keeps track of the working audio, the active isolated source, the path of the stem, path of the residual, the latest version of the processed stem.
              - listitem [ref=f4e2847]:
                - generic [ref=f4e2848]: "2."
                - paragraph [ref=f4e2850]: Planning/Assignment State - The tools selected during the planning step are stored of in a list of ’assignments.’ Each assignment tracks status (pending, in progress, retrying, done, failed) as well as the next pending assignment.
              - listitem [ref=f4e2851]:
                - generic [ref=f4e2852]: "3."
                - paragraph [ref=f4e2854]:
                  - text: Execution State - Tracks all aspects of a tool-calling step including current assignment, active source, if a branch (see
                  - link "Section D.2" [ref=f4e2855] [cursor=pointer]:
                    - /url: "#A4.SS2"
                  - text: ) is open, if there are any remaining assignments, and if the audio is ready to return
              - listitem [ref=f4e2856]:
                - generic [ref=f4e2857]: "4."
                - paragraph [ref=f4e2859]: Failure/Repair State - Tracks the failed tool name, failed tool assignment, and failed arguments to the tool call.
        - generic [ref=f4e2860]:
          - heading "D.2 Enforcing Agent Behavior" [level=3] [ref=f4e2861]:
            - generic [ref=f4e2862]: D.2
            - text: Enforcing Agent Behavior
          - paragraph [ref=f4e2864]: We place a few mechanisms to steer the behavior of the agent
          - list [ref=f4e2866]:
            - listitem [ref=f4e2867]:
              - text: •
              - paragraph [ref=f4e2869]: Separation and Mixing “Branches" - When a stem is isolated, a branch is opened and kept track of in the execution state and closed when the source is mixed back in with the residual. This branch keeps track of which source is isolated and the location of the corresponding residual track. The system will not allow another separation tool call or operation on another source until the source has been mixed in with the residual.
            - listitem [ref=f4e2870]:
              - text: •
              - paragraph [ref=f4e2872]: Forced Separation - The system can force separation if agent tries to operate on a source before isolating that source
            - listitem [ref=f4e2873]:
              - text: •
              - paragraph [ref=f4e2875]: Branch Recombination Gate - If a branch is open and there is no pending assignment, the system can force a mix tool call so the agent does not stray
            - listitem [ref=f4e2876]:
              - text: •
              - paragraph [ref=f4e2878]: Forced Pending Assignment Processing - If the agent tries to return or mix sources before it has completed all of its assignments, system will force it to perform another tool call. Forced return - If there are no more assignments and no branch is open, system will force the agent to return the audio
