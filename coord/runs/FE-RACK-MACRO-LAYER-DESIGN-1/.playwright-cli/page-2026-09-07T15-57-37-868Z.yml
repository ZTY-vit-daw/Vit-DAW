            - paragraph [ref=f4e315]: "Real recordings rarely arrive in pristine condition, but often carry artifacts that post-production is tasked with removing. To capture this side of the workflow, we define two parallel families of recipes: degradation recipes, which introduce realistic recording artifacts (vocal sibilance, 50/60Hz mains hum, low-end rumble, buried or overpowering target stems), and matched remediation recipes, which apply the corresponding cleanup."
