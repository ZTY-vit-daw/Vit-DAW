      - generic [ref=f4e1264]:
        - heading "7 Conclusion" [level=2] [ref=f4e1265]:
          - generic [ref=f4e1266]: "7"
          - text: Conclusion
        - paragraph [ref=f4e1268]: "The dominant paradigm in music ML is one-shot generation. The dominant paradigm in studio practice is iteration. Reconciling these competing visions requires data and infrastructure, and our work presents a scalable first step on this front. A first step always has limitations: our dependence on human-coded recipes, a limited operator pool, no external baselines yet available, and no perfect metrics for this problem. We invite the community to build on our work to reduce these limitations."
