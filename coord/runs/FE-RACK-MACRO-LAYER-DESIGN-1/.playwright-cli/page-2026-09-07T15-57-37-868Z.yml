      - 'heading "RIME: Enabling Large-Scale Agentic Music Post-Production" [level=1] [ref=f4e86]'
      - generic [ref=f4e87]:
        - generic [ref=f4e88]: Noah Schaffer
        - generic [ref=f4e90]:
