          - heading "6.1 Post-Production Agents Struggle in Zero-Shot Settings" [level=3] [ref=f4e1055]:
            - generic [ref=f4e1056]: "6.1"
            - text: Post-Production Agents Struggle in Zero-Shot Settings
          - paragraph [ref=f4e1058]:
            - text: "No zero-shot agent we evaluate produces edits that are consistently aligned with the ground-truth target. Sometimes, they fail altogether: of 2,922 valid ground truth edits, Gemini 3 Flash successfully produces some output for 2,918, GPT-4o Mini for 2,730, and Gemma 3n for 2,787. The failures are largely repeated tool call issues or looping up to the max steps without completion."
            - link "Table 1" [ref=f4e1059] [cursor=pointer]:
