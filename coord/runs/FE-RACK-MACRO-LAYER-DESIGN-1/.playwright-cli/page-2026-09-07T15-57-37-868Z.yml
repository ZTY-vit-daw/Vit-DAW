            - text: shows that every model has a target stem it cannot edit well, and the three models do not necessarily agree on which one. GPT-4o Mini and Gemini 3 Flash are weakest on drums (by FAD and KAD). Gemma 3n, by contrast, is weakest on vocals by a substantial margin. A second pattern emerges when we stratify by graph complexity.
            - link "Figure 3" [ref=f4e1147] [cursor=pointer]:
              - /url: "#S6.F3"
            - text: also shows that models generally struggle as edit graphs contain more operations. Specifically, in abstraction layers 1 and 2 (where parameterizations or even effects, sometimes are not explicitly defined in the prompt), there is a clear downward trend. Interestingly, the graph-level metric degrades less, suggesting that even long chains can be inferred; however, the baseline depends on the abstraction level. Together with the abstraction analysis, this suggests that zero-shot agents fail at parameter inference from natural language descriptions, struggle with operator inference at higher abstraction levels, and that such errors may compound multiplicatively along the edit chain resulting in significant deviations in the audio output.
        - generic [ref=f4e1148]:
          - heading "6.4 Finetuning Improves Abstraction Handling" [level=3] [ref=f4e1149]:
            - generic [ref=f4e1150]: "6.4"
            - text: Finetuning Improves Abstraction Handling
          - 'figure "Figure 4: Graph correctness metrics by abstraction layer for 5 graph components: kinds, stems, operators, parameters, edges. Parameter accuracy represents proportion of correct normalized parameter values at an exact match rounded to the nearest 4 decimals (for threshold sweeping, see Figure 13). Error bars show 95% CIs." [ref=f4e1151]':
            - generic [ref=f4e1153]:
              - generic [ref=f4e1154]: "Figure 4:"
              - text: "Graph correctness metrics by abstraction layer for 5 graph components: kinds, stems, operators, parameters, edges. Parameter accuracy represents proportion of correct normalized parameter values at an exact match rounded to the nearest 4 decimals (for threshold sweeping, see"
              - link "Figure 13" [ref=f4e1155] [cursor=pointer]:
                - /url: "#A5.F13"
              - text: ). Error bars show 95% CIs.
          - paragraph [ref=f4e1157]:
            - text: When trained on disjoint MTG-Jamendo tracks with independently sampled recipes,
            - link "Table 1" [ref=f4e1158] [cursor=pointer]:
              - /url: "#S6.T1"
            - text: shows that Gemma 3n SFT exhibits a much slower rate of performance degradation across abstraction layers. While it performs worse than two of the baselines (Gemma 3n and GPT-4o Mini) at abstraction layer 0, we see improvement at both abstraction layers 1 and 2. At AL1, Gemma 3n SFT outperforms all 3 models in FAD, outperforms Gemini 3 Flash and Gemma 3n in KAD and graph F1, and outperforms Gemma 3n in edit similarity. At AL2, it outperforms all baselines in FAD, KAD, audio similarity and graph F1.
          - paragraph [ref=f4e1160]:
            - link "Figure 4" [ref=f4e1161] [cursor=pointer]:
              - /url: "#S6.F4"
            - text: "shows a clear reason for this performance improvement: at abstraction layers 1 and 2 Gemma 3n SFT is the only model which correctly predicts many parameters. Interestingly, we see that for certain graph metrics (kinds, stems) Gemma 3n SFT underperforms Gemma 3n and GPT-4o Mini, however, the stronger parameterization results in higher audio and graph similarity. This indicates that even lower-capacity LLMs can learn to improve at this task, given the right data."
          - paragraph [ref=f4e1163]:
            - text: "We also note that the performance of Gemma 3n SFT is far from perfect: it correctly predicts roughly"
            - math [ref=f4e1164]:
              - generic [ref=f4e1166]:
                - generic [ref=f4e1167]: "50"
                - generic [ref=f4e1168]: "%"
            - text: of parameters within operators on average and still shows considerable degradations from abstraction layer 0 to layers 1 and 2. We draw two main conclusions from this. The first is that fine-tuning does not rely on recipe-memorization effects, and that SFT on only the planning step may not be a fully sufficient recipe for post-production agents.
