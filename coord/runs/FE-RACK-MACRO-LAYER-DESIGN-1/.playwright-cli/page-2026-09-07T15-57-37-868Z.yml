        - paragraph [ref=f4e191]: In all, no existing benchmarks match the characteristics of real-world post-production loops, as described earlier. For this, such a benchmark would need to (i) introduce both intentional modifications and degradations to audio , (ii) apply edits to individual stems and introduce them back into a mix, (iii) be able to handle instructions at varying abstraction levels, and (iv) support an iterative, listen-and-tweak workflow. In this paper, we introduce exactly this suite of components.
