                  - text: "]"
                - text: ", together with 300 additional triples for artifact-removal tasks (e.g. mains hum, low-end rumble, or vocal sibilance), enabling evaluation across instrument families, edit categories, and abstraction levels"
            - listitem [ref=f4e143]:
              - generic [ref=f4e144]: "5."
              - paragraph [ref=f4e146]: As part of this, we design and evaluate zero-shot agent baselines, in the form of multi-step tool-calling agents, surfacing major limitations to current-generation models’ abilities on this task, such as their ability to assemble the correct chain of operators vs. parameterize those operators correctly
            - listitem [ref=f4e147]:
