      - generic [ref=f4e97]:
        - heading "Abstract" [level=6] [ref=f4e98]
        - paragraph [ref=f4e99]:
          - text: "Almost every piece of recorded music you have ever heard was modified before it reached you; commercial releases rarely spring fully-formed from the mind of a musician. Despite the promise of music generation models for one-shot output, such fine-grained iterative refinement workflows are a complementary problem, and largely out of their reach. There is also a gap for musicians: while they can express what they want to hear, not all have the facility with studio production tools to implement the complex set of actions needed to realize these intuitions. We formalize this task as agentic post-production, wherein individual aspects of a song are targeted, refined, and combined into a final track. We argue the bottleneck is data: existing corpora do not reflect how realistic post-production chains map onto the vocabulary musicians and engineers actually use. We argue there is a language for modifying recorded music that is dense, consistent, and learnable. We introduce the"
          - generic [ref=f4e100]: Rule-based Instructions for Music Editing (RIME)
          - text: framework, which generates realistic paired edit-instruction data from any baseline music dataset grounded in canonical methods, design patterns, and constraints derived from real production workflows. RIME leverages POEMS, a new toolkit that combines stem separation, mixing, and common studio effects for use by multimodal agents. We use POEMS and RIME to generate 3,000 pairs of edit instructions and ground truth audio, and use this data to evaluate existing multimodal LLMs as agents on this task, showing persistent challenges in current models’ post-production capabilities. We also demonstrate RIME’s ability to improve post-production agent performance via supervised fine-tuning. We see RIME as an early step toward iterative musical agents, collaborative systems that could transform music production much as interactive coding agents have reshaped software engineering.
      - 'figure "Figure 1: Agentic music post-production with RIME. Starting from a multitrack mix, RIME creates rule-based plans and calls POEMS tools to generate data triples of source audio, output audio, and editing instruction. Downstream multimodal agents then use POEMS to implement an agentic loop in which they realize the provided instruction." [ref=f4e101]':
        - img "Refer to caption" [ref=f4e102]
        - generic [ref=f4e103]:
          - generic [ref=f4e104]: "Figure 1:"
          - text: Agentic music post-production with RIME. Starting from a multitrack mix, RIME creates rule-based plans and calls POEMS tools to generate data triples of source audio, output audio, and editing instruction. Downstream multimodal agents then use POEMS to implement an agentic loop in which they realize the provided instruction.
      - generic [ref=f4e105]:
        - heading "1 Introduction" [level=2] [ref=f4e106]:
          - generic [ref=f4e107]: "1"
          - text: Introduction
        - paragraph [ref=f4e109]: There is a pervasive loop in the studio. When a producer listens to a recording they’re working on, they will often hear something wrong, or something that could be better. They may isolate the offending stem, apply a chain of effects, blend it back in, and listen again. The musician being recorded may hear something else and make a request. The producer implements a fix, then listens again. Then again. Then again.
        - paragraph [ref=f4e111]: This loop has its own peculiar language. When a musician asks for something “warmer” or “bigger,” a seasoned engineer can translate it into a specific recipe (e.g. a high-shelf cut at 8 kHz, parallel compression on the drum bus, and a tempo-synced reverb send on the vocal) and run it. The translation between what music feels like and the sequence of operations that produces that feeling is not, in fact, magic. It is a dense and surprisingly consistent vocabulary, built up over decades of studio practice.
        - paragraph [ref=f4e113]: "Today’s AI music systems are typically not part of this loop. Yet, we have good reason to desire them to be: it admits an iterative, interactive workflow that is musician-centered at its core. It is now reasonable to ask whether a software agent could join it, because these agents live in loops of their own; loops of perception, action, reasoning, and tool-use. Indeed, this would also be a strong testbed for such agents. Each iteration in this loop couples a perceptual judgment, an instruction context, a large assortment of potential tools, planning, and reasoning. What would it take, then, to bring an agent’s loop into dialog with this post-production loop?"
        - paragraph [ref=f4e115]:
          - text: We argue what is needed is a general framework for modifying music, beyond the capabilities of one-shot generators. To this end, we introduce the
          - generic [ref=f4e116]: Rule-based Instructions for Music Editing (RIME)
          - text: framework, which aims to generate large-scale music editing data that follows a process closer to what you would see in studio music production. RIME starts from individual mixes, creates edit “recipes" using a large vocabulary of common studio engineering rules, constraints, and design patterns, and executes a series of tool calls to isolate sources, apply edits, and create a final mix. This then creates supervision for agents to do the same. Additionally, RIME creates prompts at varying levels of abstraction to describe the edit chain for a given recipe, mimicking the variation in how precisely these intents are described in the real world. To create editing data, RIME leverages a newly built suite of tools that allow for pitch, ornamentation (various effects), equalization, mixing, and source separation (POEMS) edits, which we call POEMS.
        - paragraph [ref=f4e118]: RIME is also unique in that it is extensible to any dataset which contains musical tracks, and especially designed for mixed tracks (or even generated ones, potentially, which normally come without individual instrument stems). We demonstrate using RIME in conjunction with state-of-the-art music understanding models to generate triplet edit data from untagged musical mixes.
        - generic [ref=f4e119]:
          - paragraph [ref=f4e120]: "Overall, our contributions are:"
          - list [ref=f4e121]:
            - listitem [ref=f4e122]:
              - generic [ref=f4e123]: "1."
              - paragraph [ref=f4e125]: "We formalize agentic post-production as an iterative task: starting from a mixed track and an arbitrarily clear instruction, an agent targets individual elements, refines them, and recombines them into a finished mix"
            - listitem [ref=f4e126]:
              - generic [ref=f4e127]: "2."
              - paragraph [ref=f4e129]: We introduce RIME, a scalable, reusable data generation framework for transforming virtually any corpus of musical audio into a structured set of (input, output, instruction) triples. RIME encodes recipes, motifs, ordering constraints, and pattern policies of real studio post-production, and generates prompts at multiple levels of abstraction
            - listitem [ref=f4e130]:
              - generic [ref=f4e131]: "3."
              - paragraph [ref=f4e133]: To support this, we introduce POEMS, an audio post-production toolkit spanning over 20 operators exposed via the Model Context Protocol for use by tool-calling agents
            - listitem [ref=f4e134]:
              - generic [ref=f4e135]: "4."
              - paragraph [ref=f4e137]:
                - text: We run a paired triplet benchmark with
                - math [ref=f4e138]:
