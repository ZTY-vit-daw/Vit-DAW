              - text: "). Each recipe is specified by a four-field schema: bindings (references to clip metadata that are resolved at plan-generation time, such as the target stem or detected key), when (a predicate that gates eligibility, e.g. vocal_harmony_support requires both a vocal stem and a detectable key), weight_rules (recipe-local multipliers that compose with global pattern-policy weights described later, to indicate how common certain recipes should be), and graph (a declarative three-stage edit graph, normally of the form SEPARATE"
              - math [ref=f4e268]:
                - generic [ref=f4e269]: →
              - text: PROCESS
              - math [ref=f4e271]:
                - generic [ref=f4e272]: →
              - text: MIX).
            - paragraph [ref=f4e275]:
              - text: The PROCESS stage holds the recipe’s actual processing sub-graph. The SEPARATE and MIX stages scaffold it with stem isolation and residual recombination steps, so every recipe operates in a stem-aware fashion. Each recipe encodes a single post-production intent, such as adding modulation texture, applying vocal-leveling compression, or imparting a “vintage” lower-fidelity character, among others. Recipes are symbolic in that their tool-call arguments and certain structural slots (such as the target stem) are unbound at definition time and resolved at instantiation. To share structure across recipes, we factor commonly co-occurring sub-chains into reusable units we call motifs. A motif is a named, typed sub-graph that can be expanded inline within any recipe that references it. For example, the retro_tilt_eq motif expands to high_shelf()
              - math [ref=f4e276]:
                - generic [ref=f4e277]: →
              - text: "lowpass(), capturing the joint high-frequency roll-off characteristic of a vintage sound. Each operator is also associated with a sampling prior, i.e. a distribution over its argument space calibrated so that draws produce audibly plausible edits rather than degenerate ones (e.g. a high-pass cutoff used for low-end cleanup is sampled in the 60–250Hz range, not from a uniform 20Hz–20kHz prior). Priors are defined per tool and per role: the same tool may carry a different prior when it appears in a different motif."
            - paragraph [ref=f4e280]:
