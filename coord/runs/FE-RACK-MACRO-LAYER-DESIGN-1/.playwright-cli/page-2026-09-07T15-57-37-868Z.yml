            - math [ref=f4e1067]:
              - generic [ref=f4e1069]:
                - generic [ref=f4e1070]: δ
                - generic [ref=f4e1071]: gt
            - text: and
            - math [ref=f4e1072]:
              - generic [ref=f4e1074]:
                - generic [ref=f4e1075]: δ
                - generic [ref=f4e1076]: out
            - text: ), and Graph F1 averaged over the full benchmark. On edit similarity, GPT-4o Mini reaches
            - math [ref=f4e1077]:
              - generic [ref=f4e1078]: "0.611"
            - text: ", Gemini 3 Flash"
            - math [ref=f4e1080]:
              - generic [ref=f4e1081]: "0.511"
            - text: ", and Gemma 3n"
            - math [ref=f4e1083]:
              - generic [ref=f4e1084]: "0.480"
            - text: ". There is a notable gap between graph structure recovery and audio quality, even at rank level: Gemma 3n strongly beats Gemini 3 Flash on graph F1 despite not doing so on audio. The FAD and KAD metrics both place Gemma 3n in the lowest position , which is reasonable as it is a much smaller, open-weight baseline, but disagree with"
            - math [ref=f4e1086]:
              - generic [ref=f4e1088]:
                - generic [ref=f4e1089]: Δ
                - generic [ref=f4e1090]:
                  - generic [ref=f4e1091]: sim
                  - generic [ref=f4e1092]: a
            - text: on Gemini 3 Flash vs. GPT-4o Mini. We attribute the deviation between agent output and ground truth edits to struggles with proper effect parameterization, struggles with edits of increasing complexity, and struggles with specific categories of edits.
