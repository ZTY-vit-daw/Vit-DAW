        - text: We introduce DAWZY, an open-source assistant that maps natural-language requests to precise, context-aware, reversible ReaScript actions in REAPER. DAWZY queries live session state, emits auditable edits, and favors a minimal-GUI, voice-first workflow with plain-language explanations to support learning. It primarily interacts with REAPER through LLM code generation. Ableton-MCP
