    - generic [ref=f1e230]:
      - heading "4 Conclusion" [level=2] [ref=f1e231]:
        - generic [ref=f1e232]: "4"
        - text: Conclusion
      - paragraph [ref=f1e234]:
        - text: DAWZY shows that natural-language control can enhance—not replace—human creativity in music software. By combining state tracking with context-aware code generation, it makes precise, reversible edits while keeping users in control. Current limitations stem from software-specific scripting languages and the need to adapt our system for each music program; our prototype focuses on core functions rather than advanced plugin features. As music software expands scripting capabilities
        - generic [ref=f1e235]:
          - text: (
          - link "1" [ref=f1e236] [cursor=pointer]:
            - /url: "#bib.bib6"
          - text: )
        - text: and AI code generation improves
        - generic [ref=f1e237]:
          - text: (
          - link "4" [ref=f1e238] [cursor=pointer]:
            - /url: "#bib.bib1"
          - text: ", p. 2)"
        - text: ", we expect wider adoption in professional settings. Our key contribution is transparency: users can see and modify what the system does. Next steps: (i) qualitative user studies, (ii) training or finetuning models specifically for more accurate music software scripting, and (iii) supporting scriptable DAWs beyond REAPER. We invite the community to try our demo and collaborate on this open framework for natural-language creative software control."
