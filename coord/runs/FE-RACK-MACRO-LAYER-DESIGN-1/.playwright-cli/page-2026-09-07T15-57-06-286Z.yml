    - generic [ref=f1e175]:
      - heading "3 Evaluation" [level=2] [ref=f1e176]:
        - generic [ref=f1e177]: "3"
        - text: Evaluation
      - paragraph [ref=f1e179]: We evaluate DAWZY using both objective and qualitative performance tasks, as well as subjective user ratings.
      - generic [ref=f1e180]:
        - heading "3.1 Objective Evaluation" [level=3] [ref=f1e181]:
          - generic [ref=f1e182]: "3.1"
          - text: Objective Evaluation
        - paragraph [ref=f1e184]: "To test reliability, we designed four reproducible tasks: (1) Multi-instruction FX processing — \"Double the first track’s volume, increase the decay, and set the attack to 10 ms,\" (2) GUI navigation — \"Open the FX browser for the first track,\" (3) Workflow automation — \"Duplicate the first track, pitch it up one octave, and blend it in at 20%,\" and (4) Educational interaction — \"What does attack time do in the second track’s compressor?\". Building on the four tasks, we ran 3 trials per task for 4 different LLMs. Open-source baselines (QWEN-480B, GPT-OSS-120B, GPT-OSS-20B) achieved only 25–50% success, often failing due to hallucinated or invalid ReaScript functions and mis-indexed parameters. All models did however pass all 3 trials on the Education task."
      - generic [ref=f1e185]:
        - heading "3.2 Ableton-MCP Comparison" [level=3] [ref=f1e186]:
          - generic [ref=f1e187]: "3.2"
          - text: Ableton-MCP Comparison
        - paragraph [ref=f1e189]: "We compared DAWZY and Ableton-MCP on three qualitative tasks: \"Make notes slide into each other\" (Wavy), \"Make the track bouncy\" (Bouncy), and \"Make the track fade\" (Fade). Success was determined by perceived audio changes or external validation (Google/ChatGPT). Both systems used Claude Sonnet 4.5. DAWZY (REAPER with custom prompt) encountered 3 execution errors on Fade but otherwise performed successfully. Ableton-MCP (Ableton Live via Claude Desktop) failed Wavy and Fade due to reported API limitations for modifying notes and volume. For Bouncy, it either incorrectly claimed success or created new segments instead of modifying existing ones. DAWZY’s superior performance likely reflects Claude’s pre-training on REAPER’s publicly available documentation, whereas Ableton Live’s API is newer and underrepresented in training data. Based of this result we expect similar results for open-source models like GPT-OSS-120B."
