    - generic [ref=f1e40]:
      - heading "Abstract" [level=6] [ref=f1e41]
      - paragraph [ref=f1e42]:
        - text: Digital Audio Workstations (DAWs) offer fine control, but mapping high-level intent (e.g., “warm the vocals”) to low-level edits breaks creative flow. Existing artificial intelligence (AI) music generators are typically one-shot, limiting opportunities for iterative development and human contribution. We present DAWZY, an open-source assistant that turns natural-language (text/voice/hum) requests into reversible actions in REAPER. DAWZY keeps the DAW as the creative hub with a minimal GUI and voice-first interface. Its LLM-based code generation replaces complex menus with a simple chat box, reducing time spent learning interfaces. DAWZY also uses three Model Context Protocol tools for live state queries, parameter adjustment, and AI beat generation. It maintains grounding by refreshing state before mutation; and ensures safety and reversibility with atomic scripts and undo. In evaluations, DAWZY performed reliably on common production tasks and was rated positively by users across Usability, Control, Learning, Collaboration, and Enjoyment. We show reliability on common production tasks; code and a short demo are available.
        - superscript [ref=f1e44]: "1"
