schema_version: vit.level_card.v0
id: music-creation-unit2-demo
title: 把旋律的起伏写成自己的作品
story: 本局任务：试写四种旋律线，发展一个喜欢的片段，再参照给定节奏创作八小节主题并听见成曲。最终交付：四条两小节片段、一个发展稿、八小节主题、现场试听与生成版本、作业报表和过程摘要。
lead_default: human
players:
    - human
    - model
timing:
    bpm_default: 80
    time_signature: 2/4
    beats_per_bar: 2
    pickup_beats: 0
    clip_origins:
        eight-bar-theme:
            start_beats_global: 0
            first_bar: 1
        rhythm-lab:
            start_beats_global: 0
            first_bar: 1
    bar_span:
        first_bar: 1
        last_bar: 8
