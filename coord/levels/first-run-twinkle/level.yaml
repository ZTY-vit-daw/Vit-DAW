# 卡：coord/cards/doing/2026-11-05-EDU-LEVEL-CONTENT-1.md（池序 279，定稿轮 2026-11-07）
# 设计权威：DESIGN-DRAFT-2026-11-06.md（先行稿，主管验收 pass；本文件=其 §2.5 蓝本定稿落成）
