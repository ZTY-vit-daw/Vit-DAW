  - 课程按任务量与证据推进，展演5分钟录播/截图/产物；不等待课时时长确认
  - 当前源格式/音乐控件/可信工程检查接线未实现，不能直接加载本文件
  - 材料库22项中已生成2份基础MIDI但未实际音源听核，余20项待定截段/转写；MusicXML/音频与鼓旋律音源仍待准备
  - material_group及按ID加载是拟议设计语义，需要准备层实现，不能只给现有运行时一个catalog文件便声称能播放
