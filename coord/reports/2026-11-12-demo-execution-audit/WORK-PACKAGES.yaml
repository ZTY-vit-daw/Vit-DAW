# 审计后的工作包，不是已确认/可领取的任务卡；不占用共享池序。
# 工时为首次估算的专注工程投入，非模型采样时长或用户劳动时间。
# final_hours包含first_hours；合计时不能相加。真实栈只能一个owner串行。
# 2026-11-12 W00合入修订（REVISIONS §4 + REVIEW-GLM §3）：新增W18/W19；调整W02/W05-W10/W12/W15/W16依赖与工时；
# 工程拍号统一2/4、节奏稿=旋律轨clip、鼓轨辅助律动、音频走内核、演示拍号不写工程。
schema_version: vit.demo_workplan.draft.v0
audit_date: '2026-11-12'
target_first_version: '2026-11-19'
target_exhibition_ready: '2026-11-30'
status: for_scheduling_discussion
execution_mode: daily_decision_flow_with_parallel_execution_subagents
recommended_main_lanes: [ui_score, runtime_authoring, audio_generation]
materials: rotate_into_available_executor_slots
existing_cards_to_reuse: [LAUNCHER-FE-LAYOUT-FIX-1, RECENTS-HYGIENE-1]
no_automatic_claim_or_dispatch_in_this_audit: true

work_packages:
