<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>板A · Boogie Woogie 时间线 — 蒙德里安晚期路线</title>
<style>
:root{
  --ink:#111318; --paper:#fff; --canvas:#f4f4f1; --warm:#f6f4ec; --hair:#c9c9c3; --muted:#656565;
  --blue:#1557d6; --blue-dark:#0f43aa; --blue-soft:#e8efff; --blue-inp:#dbe6fc; --blue-lt:#73b8f5;
  --red:#e63426; --red-gd:#db1215; --yellow:#ffd42a; --green:#1a8d5b; --purple:#a78bfa;
  --dark:#2e3437; --dark2:#1d2122; --grid:#3a4246; --gridm:#4a545a; --dim:#8a959c;
  --mono:Consolas,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--dark);position:relative}

/* ===== 走带条 ===== */
.transport{position:absolute;top:0;left:0;right:0;height:64px;background:var(--paper);
  border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:14px;padding:0 14px}
.mark{position:relative;width:44px;height:42px;overflow:hidden;border:2px solid var(--ink);background:var(--paper);flex:none}
.mark strong{position:absolute;inset:0 15px 15px 0;display:grid;place-items:center;
  border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);color:#fff;background:var(--blue);font-size:17px;font-weight:900}
.mark i{position:absolute;bottom:0;left:0;width:14px;height:15px;border-top:2px solid var(--ink);border-right:2px solid var(--ink);background:var(--red-gd)}
.mark b{position:absolute;bottom:0;right:0;width:15px;height:15px;border-top:2px solid var(--ink);border-left:2px solid var(--ink);background:var(--yellow)}
.tdiv{width:2px;height:32px;background:#d8dee8;flex:none}
.tname{display:flex;flex-direction:column;line-height:1.2}
.tname b{font-size:14px}.tname small{font-family:var(--mono);font-size:9px;color:var(--muted)}
.tmono{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tmono.big{font-size:16px;font-weight:700;color:var(--ink)}
.tmono.big span{font-size:10px;color:var(--muted);font-weight:400}
.tc{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:1px}
.tbtn{width:34px;height:34px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;
  font-size:13px;cursor:pointer}
.tbtn.on{background:var(--blue);color:#fff}
.tbtn.loop{background:var(--yellow)}
.spacer{flex:1}
.chip{font-size:11px;font-weight:700;border:2px solid var(--ink);background:var(--paper);padding:4px 9px;white-space:nowrap}
.chip.audition{background:var(--blue-soft);color:var(--blue-dark);border-color:var(--blue)}
.rec{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red-gd)}
.rec::before{content:"";width:10px;height:10px;background:var(--red-gd)}

/* ===== 段落带 ===== */
.sections{position:absolute;top:64px;left:0;right:0;height:26px;background:var(--dark2)}
.stab{position:absolute;top:4px;bottom:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#cfd6da;border:1px solid var(--gridm)}
.stab.on{background:var(--blue-inp);color:var(--ink);font-weight:700;border:2px solid var(--ink)}

/* ===== 轨道头列 ===== */
.thcol{position:absolute;left:0;top:90px;width:168px;height:800px;background:var(--paper);
  border-right:2px solid var(--ink)}
.thcol .thcap{position:absolute;top:0;left:0;right:0;height:20px;display:flex;align-items:center;
  padding:0 10px;font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted);
  border-bottom:1px solid #d8dee8}
.th{position:absolute;left:0;width:168px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;
  border-bottom:1px solid #d8dee8}
.th .sq{width:10px;height:10px;border:2px solid var(--ink);flex:none}
.th .nm{flex:1;min-width:0;line-height:1.15}
.th .nm b{display:block;font-size:12px;white-space:nowrap}
.th .nm small{font-family:var(--mono);font-size:8.5px;color:var(--muted)}
.ms{display:flex;gap:4px;flex:none}
.ms i{width:16px;height:16px;border:1px solid var(--ink);display:grid;place-items:center;
  font-style:normal;font-family:var(--mono);font-size:9px;font-weight:700}
.ms .s.on{background:var(--blue);color:#fff}
.ms .m.on{background:var(--red-gd);color:#fff}

/* ===== 网格区 ===== */
.grid{position:absolute;left:168px;top:90px;width:1432px;height:800px;
  background:
    repeating-linear-gradient(90deg,transparent 0 111px,var(--gridm) 111px 112px),
    repeating-linear-gradient(90deg,transparent 0 27px,var(--grid) 27px 28px),
    var(--dark)}
.barnums{position:absolute;top:0;left:0;right:0;height:20px}
.barnums span{position:absolute;top:3px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.lane{position:absolute;left:0;width:1432px;border-bottom:1px solid #24292c}
.clip{position:absolute;border-left:2px solid var(--ink)}
.clip label{position:absolute;top:2px;left:6px;font-size:10px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.clip.y{background-color:var(--yellow);
  background-image:repeating-linear-gradient(90deg,rgba(17,19,24,.26) 0 2px,transparent 2px 8px)}
.clip.b{background-color:var(--blue-lt);
  background-image:repeating-linear-gradient(90deg,rgba(17,19,24,.20) 0 2px,transparent 2px 6px)}
.clip.p{background-color:var(--warm);
  background-image:repeating-linear-gradient(90deg,rgba(17,19,24,.10) 0 2px,transparent 2px 10px)}
.clip.ref{border:1px dashed var(--dim);background:rgba(138,149,156,.06);border-left:1px dashed var(--dim)}
.clip.ref label{color:var(--dim);font-family:var(--mono);font-weight:400;letter-spacing:0}
.clip.sel{outline:2px solid var(--red-gd);outline-offset:0}
.crossed{animation:cpulse 1.1s ease-in-out infinite}
@keyframes cpulse{0%,100%{box-shadow:0 0 0 3px rgba(255,212,42,.38)}50%{box-shadow:0 0 0 7px rgba(255,212,42,.10)}}
.ph{position:absolute;left:839px;top:20px;bottom:0;width:2px;background:#fff;z-index:5}
.ph::before{content:"";position:absolute;top:-2px;left:-9px;width:20px;height:14px;
  background:var(--red-gd);border:2px solid var(--ink)}

/* ===== 全曲鸟瞰 ===== */
.overview{position:absolute;top:890px;left:0;right:0;height:62px;background:var(--dark2);
  border-top:2px solid var(--gridm);display:flex;align-items:center}
.ovlabel{width:168px;flex:none;padding-left:12px;line-height:1.25}
.ovlabel b{display:block;font-size:11px;color:#e8e4da}
.ovlabel small{font-family:var(--mono);font-size:9px;color:var(--dim)}
.ovmap{position:relative;width:1320px;height:40px}
.ovs{position:absolute;top:11px;height:18px;border:1px solid var(--gridm)}
.ovs.y{background:var(--yellow)}.ovs.b{background:var(--blue-lt)}.ovs.p{background:var(--warm)}
.ovs.t{background:transparent;border:1px dashed var(--gridm)}
.ovwin{position:absolute;top:4px;height:32px;border:1px solid #fff;background:rgba(255,255,255,.05)}
.ovph{position:absolute;top:2px;height:36px;width:2px;background:var(--red-gd)}

/* ===== 节拍格（签名件） ===== */
.pulse{position:absolute;top:952px;left:0;right:0;height:48px;background:var(--dark2);
  border-top:2px solid var(--gridm);display:flex;align-items:center}
.plabel{width:168px;flex:none;padding-left:12px;line-height:1.25}
.plabel b{display:block;font-size:11px;color:#e8e4da}
.plabel small{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px}
.pcells{display:flex;gap:10px;align-items:center;flex:none}
.pcells span{width:13px;height:13px;border:1px solid var(--gridm);flex:none}
.pcells .past{background:var(--yellow);border-color:var(--yellow)}
.pcells .now{width:17px;height:17px;background:var(--yellow);border:2px solid #fff;animation:beat .5s infinite alternate}
@keyframes beat{from{transform:scale(1)}to{transform:scale(.72)}}
.plegend{margin-left:auto;padding-right:14px;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
</style>
</head>
<body>

<div class="transport">
  <div class="mark"><strong>V</strong><i></i><b></b></div>
  <div class="tdiv"></div>
  <div class="tname"><b>5.26 草稿</b><small>48kHz · 24bit</small></div>
  <div class="tdiv"></div>
  <div class="tmono big">120.0 <span>BPM</span></div>
  <div class="tmono">4/4</div>
  <div class="tdiv"></div>
  <div class="tc">00:00:57:12</div>
  <button class="tbtn">■</button>
  <button class="tbtn on">▶</button>
  <button class="tbtn loop">⟳</button>
  <div class="spacer"></div>
  <span class="chip">FX 湿链 B</span>
  <span class="chip audition">● 试听中</span>
  <span class="rec">REC</span>
</div>

<div class="sections">
  <span class="stab" style="left:168px;width:448px">主歌 A</span>
  <span class="stab on" style="left:616px;width:448px">副歌</span>
  <span class="stab" style="left:1064px;width:448px">主歌 B</span>
  <span class="stab" style="left:1512px;width:86px">桥段</span>
</div>

<div class="thcol">
  <div class="thcap">TRACKS</div>
  <div class="th" style="top:20px;height:120px"><span class="sq" style="background:var(--yellow)"></span>
    <div class="nm"><b>主唱</b><small>AUDIO</small></div><div class="ms"><i class="m">M</i><i class="s">S</i></div></div>
  <div class="th" style="top:140px;height:80px"><span class="sq" style="background:var(--yellow)"></span>
    <div class="nm"><b>和声</b><small>AUDIO ×2</small></div><div class="ms"><i class="m">M</i><i class="s">S</i></div></div>
  <div class="th" style="top:220px;height:150px"><span class="sq" style="background:var(--blue-lt)"></span>
    <div class="nm"><b>鼓组</b><small>MIDI</small></div><div class="ms"><i class="m">M</i><i class="s">S</i></div></div>
  <div class="th" style="top:370px;height:100px"><span class="sq" style="background:var(--blue-lt)"></span>
    <div class="nm"><b>贝斯</b><small>MIDI</small></div><div class="ms"><i class="m">M</i><i class="s on">S</i></div></div>
  <div class="th" style="top:470px;height:120px"><span class="sq" style="background:var(--yellow)"></span>
    <div class="nm"><b>Synth Pad</b><small>AUDIO</small></div><div class="ms"><i class="m">M</i><i class="s">S</i></div></div>
  <div class="th" style="top:590px;height:70px"><span class="sq" style="background:var(--warm)"></span>
    <div class="nm"><b>FX 湿链</b><small>BUS · B</small></div><div class="ms"><i class="m">M</i><i class="s">S</i></div></div>
  <div class="th" style="top:660px;height:70px"><span class="sq" style="background:var(--warm)"></span>
    <div class="nm"><b>混响总线</b><small>BUS</small></div><div class="ms"><i class="m">M</i><i class="s">S</i></div></div>
  <div class="th" style="top:730px;height:70px"><span class="sq" style="background:#cfd6da"></span>
    <div class="nm"><b>参考轨</b><small>REF · RLM</small></div><div class="ms"><i class="m on">M</i><i class="s">S</i></div></div>
</div>

<div class="grid">
  <div class="barnums" id="barnums"></div>
  <div class="lane" style="top:20px;height:120px"></div>
  <div class="lane" style="top:140px;height:80px"></div>
  <div class="lane" style="top:220px;height:150px"></div>
  <div class="lane" style="top:370px;height:100px"></div>
  <div class="lane" style="top:470px;height:120px"></div>
  <div class="lane" style="top:590px;height:70px"></div>
  <div class="lane" style="top:660px;height:70px"></div>
  <div class="lane" style="top:730px;height:70px"></div>

  <!-- 主唱 -->
  <div class="clip y" style="left:224px;top:28px;width:448px;height:88px"><label>主唱 A1</label></div>
  <div class="clip y sel crossed" style="left:700px;top:28px;width:420px;height:88px"><label>主唱 · 副歌</label></div>
  <!-- 和声 -->
  <div class="clip y crossed" style="left:448px;top:148px;width:448px;height:64px"><label>和声堆叠</label></div>
  <div class="clip y" style="left:952px;top:148px;width:224px;height:64px"><label>和声 · 回应</label></div>
  <!-- 鼓组 -->
  <div class="clip b crossed" style="left:0;top:228px;width:1428px;height:134px"><label>鼓组 LOOP · 4 小节</label></div>
  <!-- 贝斯 -->
  <div class="clip b" style="left:224px;top:378px;width:448px;height:84px"><label>贝斯 A</label></div>
  <div class="clip b crossed" style="left:700px;top:378px;width:420px;height:84px"><label>贝斯 · 副歌</label></div>
  <!-- Synth Pad -->
  <div class="clip y" style="left:448px;top:478px;width:448px;height:104px"><label>Pad 长音</label></div>
  <div class="clip y crossed" style="left:784px;top:478px;width:168px;height:104px"><label>Pad 上行</label></div>
  <!-- FX 湿链（总线段） -->
  <div class="clip p" style="left:336px;top:598px;width:112px;height:54px"><label>湿链 A</label></div>
  <div class="clip p crossed" style="left:784px;top:598px;width:112px;height:54px"><label>湿链 B</label></div>
  <!-- 混响总线 -->
  <div class="clip p crossed" style="left:448px;top:668px;width:896px;height:54px"><label>Rev Bus</label></div>
  <!-- 参考轨 -->
  <div class="clip ref" style="left:0;top:738px;width:1428px;height:54px"><label>参考轨 · RLM 目标 −14 LUFS · 已装载</label></div>

  <div class="ph"></div>
</div>

<div class="overview">
  <div class="ovlabel"><b>全曲鸟瞰</b><small>96 拍 · 24 小节</small></div>
  <div class="ovmap">
    <span class="ovs y" style="left:0;width:220px"></span>
    <span class="ovs b" style="left:220px;width:220px"></span>
    <span class="ovs y" style="left:440px;width:220px"></span>
    <span class="ovs p" style="left:660px;width:220px"></span>
    <span class="ovs t" style="left:880px;width:440px"></span>
    <span class="ovwin" style="left:0;width:701px"></span>
    <span class="ovph" style="left:412px"></span>
  </div>
</div>

<div class="pulse">
  <div class="plabel"><b>节拍格</b><small>BOOGIE · 4/4</small></div>
  <div class="pcells" id="pcells"></div>
  <div class="plegend">■ 音频 clip　■ MIDI　□ 总线段　红框=选中　▮=节拍</div>
</div>

<script>
(function(){
  var bn=document.getElementById('barnums');
  for(var m=1;m<=49;m+=4){
    var s=document.createElement('span');
    s.textContent=m; s.style.left=((m-1)*28+3)+'px';
    bn.appendChild(s);
  }
  var pc=document.getElementById('pcells');
  for(var b=1;b<=51;b++){
    var c=document.createElement('span');
    if(b<30)c.className='past'; else if(b===30)c.className='now';
    pc.appendChild(c);
  }
})();
</script>
</body>
</html>
